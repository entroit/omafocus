name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic accounting tests
        env:
          TZ: Europe/Berlin
        run: node test/session-test.js
